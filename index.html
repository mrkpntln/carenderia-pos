/* Card-style action buttons and editable cart list */
.checkout-actions{flex-direction:row;align-items:center;justify-content:flex-end;gap:10px}
.checkout-actions .action-card{width:76px;height:68px;min-width:76px;padding:6px 4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;box-shadow:0 2px 7px #00000012}
.checkout-actions .action-card strong{font-size:11px;line-height:1.1}
.checkout-actions .action-icon{font-size:22px;line-height:1}
.checkout-actions .checkout-btn{background:var(--gold);border:1px solid var(--gold-dark)}
.checkout-actions .start-over{background:#fff;border:1px solid #d4d4d4;color:#565656}
.cart-order-list{max-height:34vh;overflow:auto;border-top:1px solid #eee;border-bottom:1px solid #eee;margin:12px 0;padding:4px 0}
.cart-order-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid #f0f0f0}
.cart-order-row:last-child{border-bottom:0}
.cart-order-name{font-weight:750;font-size:14px}
.cart-order-price{font-size:12px;color:#777;margin-top:2px}
.cart-order-controls{display:flex;align-items:center;gap:5px}
.cart-order-controls button{width:30px;height:30px;border-radius:7px;background:#f2f2f2;font-weight:900}
.cart-order-controls .remove-item{background:#fff0f0;color:#bd2525}
.cart-order-qty{min-width:18px;text-align:center;font-weight:800}
.cart-order-subtotal{font-size:13px;font-weight:800;white-space:nowrap}
.cart-empty{padding:22px;text-align:center;color:#888;font-size:13px}

const $ = id => document.getElementById(id);
if (!window.supabase?.createClient) {
  $("loginError").textContent = "Supabase library failed to load. Connect to the internet, then refresh this page.";
  throw new Error("Supabase JS library unavailable");
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
  auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
});
let categories=[], products=[], cart=new Map(), activeCategory="home", stage="main", lastReceipt=null;
const ADDON_NAMES=["Drinks","Rice","Fruits","Dessert"];
const money = n => new Intl.NumberFormat("en-PH",{style:"currency",currency:"PHP"}).format(Number(n||0));
const OFFLINE_DB_NAME="cdp-hybrid-pos", OFFLINE_DB_VERSION=1, OFFLINE_STORE="pendingOrders";
function openOfflineDB(){return new Promise((resolve,reject)=>{if(!window.indexedDB){reject(new Error("This browser does not support offline storage."));return}const req=indexedDB.open(OFFLINE_DB_NAME,OFFLINE_DB_VERSION);req.onupgradeneeded=()=>{const db=req.result;if(!db.objectStoreNames.contains(OFFLINE_STORE))db.createObjectStore(OFFLINE_STORE,{keyPath:"clientOrderId"})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error("Unable to open offline storage."))})}
async function offlineStore(mode,action,value){const db=await openOfflineDB();return new Promise((resolve,reject)=>{const tx=db.transaction(OFFLINE_STORE,mode),store=tx.objectStore(OFFLINE_STORE);let req;if(action==="all")req=store.getAll();else if(action==="put")req=store.put(value);else if(action==="delete")req=store.delete(value);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);tx.oncomplete=()=>db.close();tx.onerror=()=>{db.close();reject(tx.error)}})}
function newClientOrderId(){return window.crypto?.randomUUID?crypto.randomUUID():"xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g,c=>{const r=Math.random()*16|0;return(c==="x"?r:(r&3|8)).toString(16)})}
async function updateOfflineStatus(){
 try{const rows=await offlineStore("readonly","all");pendingSyncCount=rows.length}catch(e){pendingSyncCount=0;console.warn(e)}
 const bar=$("offlineStatus");if(!bar)return;
 bar.classList.toggle("offline",!navigator.onLine||isOfflineCashier);bar.classList.toggle("error",!!window.cdpSyncError);
 $("offlineStatusText").textContent=(!navigator.onLine||isOfflineCashier)?"OFFLINE CASHIER MODE":"ONLINE";
 $("pendingSyncText").textContent=pendingSyncCount?`· ${pendingSyncCount} sale${pendingSyncCount===1?"":"s"} waiting to sync`:"· All sales synced";
 $("syncPendingBtn").classList.toggle("hidden",!navigator.onLine||pendingSyncCount===0||currentRole!=="cashier");
}
async function saveOfflineSale(record){await offlineStore("readwrite","put",record);await updateOfflineStatus()}
async function syncPendingOrders(){
 if(!navigator.onLine||currentRole!=="cashier"||syncInProgress)return;
 syncInProgress=true;window.cdpSyncError=false;
 try{
  const rows=(await offlineStore("readonly","all")).sort((a,b)=>String(a.createdAt).localeCompare(String(b.createdAt)));
  for(const sale of rows){
   if(!navigator.onLine)break;
   const {data,error}=await sb.rpc("create_cash_order_offline_sync",{p_client_order_id:sale.clientOrderId,p_items:sale.items,p_total:sale.total,p_cash_received:sale.cash});
   if(error){window.cdpSyncError=true;console.error("CDP offline sale sync failed",sale.clientOrderId,error);notify("A saved offline sale could not sync: "+error.message);break}
   const saved=Array.isArray(data)?data[0]:data;
   if(!saved?.order_id){window.cdpSyncError=true;notify("Sync response was incomplete. The sale remains saved on this device.");break}
   await offlineStore("readwrite","delete",sale.clientOrderId);
  }
 }catch(e){window.cdpSyncError=true;console.error("CDP offline sync error",e);}
 finally{syncInProgress=false;await updateOfflineStatus()}
}

async function showApp(user){
 if(!user?.id)return;
 if(authUserId===user.id && currentRole){updateOfflineStatus();return}
 authUserId=user.id;
 let role=null;
 if(navigator.onLine){
  const {data,error}=await sb.rpc("get_my_app_role");
  if(!error&&data){role=String(data).toLowerCase();localStorage.setItem(roleCacheKey(user.id),role)}
  else if(!navigator.onLine||/fetch|network|timeout|connection|load failed/i.test(error?.message||"")) {role=localStorage.getItem(roleCacheKey(user.id));if(role==="cashier")isOfflineCashier=true;}
  else {console.error("CDP role lookup failed:",error);showLogin();$("loginError").textContent="Unable to verify account role. Connect to the internet and try again.";return}
 }else role=localStorage.getItem(roleCacheKey(user.id));
 currentRole=String(role||"").toLowerCase();
 if(!["admin","cashier"].includes(currentRole)){showLogin();$("loginError").textContent="Offline access is available only to a cashier who has signed in online on this device.";return}
 if(!navigator.onLine && currentRole!=="cashier"){showLogin();$("loginError").textContent="Admin access requires an internet connection. Offline mode is cashier-only.";return}

async function loadMenu(){

  if(!c.error&&!p.error){
   categories=c.data||[];products=p.data||[];
   try{localStorage.setItem(menuCacheKey,JSON.stringify({categories,products,savedAt:new Date().toISOString()}))}catch(e){console.warn("Menu cache could not be saved",e)}
   isOfflineCashier=false;renderCategories();renderProducts();updateOfflineStatus();return;
  }
  console.error("CDP menu refresh failed:",c.error,p.error);
 }
 try{
  const cached=JSON.parse(localStorage.getItem(menuCacheKey)||"null");
  if(cached&&Array.isArray(cached.categories)&&Array.isArray(cached.products)){
   categories=cached.categories;products=cached.products;isOfflineCashier=currentRole==="cashier";renderCategories();renderProducts();updateOfflineStatus();

fter payment. Android/browser print options depend on the printer and its supported print service.</p><p style="margin:8px 0 0;color:#8a5a12"><strong>Note:</strong> Saving Bluetooth here does not pair the printer or guarantee direct ESC/POS printing. We still need to verify the exact Officom model and Bluetooth protocol.</p></div><div id="printerSavedNote" style="font-size:12px;color:#326143;min-height:16px"></div>

 }else if(tab==="reports"){

function formatDateTime12(value){return new Date(value).toLocaleString("en-PH",{timeZone:"Asia/Manila",year:"numeric",month:"short",day:"2-digit",hour:"numeric",minute:"2-digit",hour12:true});}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}

<style id="cdp-design-refinement">
/* CDP visual refinement — presentation only; existing POS logic is unchanged */
:root{
  --gold:#e9b949;--gold-dark:#c99422;--ink:#202a24;--muted:#778078;
  --line:#e6e9e4;--paper:#fff;--soft:#f6f8f4;--red:#b94343;

}

/* CDP Print Service hand-off.
   The Android companion app will register cdpprint://print and receive the encoded receipt.
   This works from Chrome and an installed PWA because both can open Android deep links. */
function cdpPrintServiceSend(receipt, options={}){
 const settings=(()=>{try{return JSON.parse(localStorage.getItem("cdpPrinterSettings")||"{}")}catch{return {}}})();
 const payload={
  protocol:"cdp-print-v1",source:"CDP POS",
  printer:{connection:settings.connection||"Bluetooth",paper:settings.paper||"58mm"},
  receipt:{
   receipt:String(receipt.receipt??""),
   date:receipt.date instanceof Date?receipt.date.toISOString():String(receipt.date||new Date().toISOString()),
   orderType:receipt.orderType||"dinein",orderLabel:receipt.orderLabel||null,tableNo:receipt.tableNo||null,
   offline:!!receipt.offline,test:!!receipt.test,
   items:(receipt.items||[]).map(i=>({name:String(i.product_name||i.name||"Item"),quantity:Number(i.quantity||1),unitPrice:Number(i.unit_price??i.price??0),lineTotal:Number(i.line_total??(Number(i.unit_price??i.price??0)*Number(i.quantity||1)))})),
   total:Number(receipt.total||0),cash:Number(receipt.cash||0),change:Number(receipt.change||0)
  },display:{business:settings.business!==false,date:settings.date!==false,cash:settings.cash!==false}
 };
 try{
  sessionStorage.setItem("cdpPrintLastPayload",JSON.stringify(payload));
  // The Android BroadcastReceiver accepts this URI and forwards it to the already-running print foreground service.
  // It does not launch the companion app's screen.
  window.location.href="cdpprint://print?payload="+encodeURIComponent(JSON.stringify(payload));
  notify("Sending receipt to printer…");
  return true;
 }catch(error){
  console.error("CDP Print Service hand-off failed:",error);
  notify("Could not send receipt to printer: "+(error.message||"unknown error"));
  return false;
 }
}
function cdpBrowserPrintFallback(paper="58mm"){
 let style=document.getElementById("cdpPrintPaperStyle");
 if(!style){style=document.createElement("style");style.id="cdpPrintPaperStyle";document.head.appendChild(style)}
 style.textContent=`@media print{@page{size:${paper} auto;margin:2mm}.receipt-card{width:${paper==="58mm"?"54mm":"76mm"}!important;max-width:${paper==="58mm"?"54mm":"76mm"}!important;margin:0 auto!important;padding:3mm!important}}`;
 window.print();
}
window.CDPPrintService={
 version:"cdp-print-v1",
 send:cdpPrintServiceSend,
 browserFallback:cdpBrowserPrintFallback
};

 if(r.orderType==="takeout"||r.orderLabel){const kind=document.createElement("div");kind.className="receipt-line";kind.textContent=r.orderLabel||"TAKE OUT";body.append(kind)}else if(r.tableNo){const table=document.createElement("div");table.className="receipt-line";table.textContent="Table "+r.tableNo;body.append(table)}
 const date=document.createElement("div");date.className="receipt-line";date.textContent=formatDateTime12(r.date||new Date());body.append(date);
 const lines=document.createElement("div");lines.className="receipt-lines";
 (r.items||[]).forEach(i=>{const line=document.createElement("div");line.className="receipt-line";const a=document.createElement("span");a.textContent=(i.product_name||i.name||"Item")+" × "+(i.quantity||1);const b=document.createElement("strong");b.textContent=money(i.line_total??(Number(i.unit_price||i.price||0)*Number(i.quantity||1)));line.append(a,b);lines.append(line)});body.append(lines);
 [["TOTAL",money(r.total||0)],["CASH",money(r.cash||0)],["CHANGE",money(r.change||0)]].forEach(([a,b])=>{const l=document.createElement("div");l.className="receipt-line";const x=document.createElement("strong");x.textContent=a;const y=document.createElement("strong");y.textContent=b;l.append(x,y);body.append(l)});
}

/* Cashier flow: choose menu items, then Save -> Dine In (select/merge Table 1–11) or Take Out (separate queue order). Queue offers Pay or Remove. */
let queueOrders=[];
let editingQueueId=null;
let selectedTable=localStorage.getItem("cdpSelectedTable")||"1";
try{
 const savedQueue=JSON.parse(localStorage.getItem("cdpUnpaidQueue")||"[]");
 if(Array.isArray(savedQueue)) queueOrders=savedQueue;
}catch(e){queueOrders=[]}

function persistQueue(){
 try{localStorage.setItem("cdpUnpaidQueue",JSON.stringify(queueOrders))}catch(e){console.warn("Queue storage unavailable",e)}
 renderQueueCount();
}
function renderQueueCount(){
 const el=$("queueCount");
 if(el)el.textContent=String(queueOrders.length);
}
function setCashierActionLabels(){
 const btn=$("payBtn");
 const label=btn?.querySelector("strong");
 if(label)label.textContent=stage==="main"?"Proceed":"Save";

 if(btn)btn.disabled=stage==="addons"&&(count===0||total()<=0);
 const icon=btn?.querySelector(".action-icon");
 if(icon)icon.textContent=stage==="main"?"➜":"+";
 const back=$("clearCart")?.querySelector("strong");
 if(back)back.textContent=stage==="addons"?"Back":"Start Over";
}
let queueFilter="all";
function renderQueue(){
 const host=$("queueList");
 if(!host)return;
 const all=queueOrders.length;
 const dine=queueOrders.filter(o=>o.orderType!=="takeout").length;
 const take=queueOrders.filter(o=>o.orderType==="takeout").length;
 $("queueAllCount").textContent=all;
 $("queueDineCount").textContent=dine;
 $("queueTakeCount").textContent=take;
 document.querySelectorAll(".queue-filter").forEach(b=>b.classList.toggle("active",b.dataset.filter===queueFilter));
 host.innerHTML="";
 const visible=queueOrders.filter(o=>queueFilter==="all"||(queueFilter==="takeout"?o.orderType==="takeout":o.orderType!=="takeout"));
 if(!visible.length){
  host.innerHTML='<div class="queue-empty"><strong>No orders</strong></div>';
  return;
 }
 visible.forEach(order=>{
  const card=document.createElement("article");card.className="queue-order";
  const title=document.createElement("h3");
  title.textContent=order.orderType==="takeout"?(order.orderLabel||"Take Out"):`Table ${order.tableNo||"—"}`;
  const details=document.createElement("p");
  details.textContent=order.items.map(i=>`${i.name} ×${i.qty}`).join(" · ");
  const totalEl=document.createElement("div");totalEl.className="queue-order-total";
  totalEl.textContent=money(order.items.reduce((s,i)=>s+Number(i.price)*i.qty,0));
  const actions=document.createElement("div");actions.className="queue-order-actions";
  const pay=document.createElement("button");pay.type="button";pay.className="queue-pay";pay.textContent="Pay";
  pay.onclick=()=>openQueuedPayment(order.id);
  const del=document.createElement("button");del.type="button";del.className="queue-delete";del.textContent="Remove";
  del.onclick=()=>{if(!confirm("Remove this unpaid order from the queue?"))return;queueOrders=queueOrders.filter(x=>x.id!==order.id);persistQueue();renderQueue();notify("Queued order removed.")};
  actions.append(pay,del);card.append(title,details,totalEl,actions);host.append(card);
 });
}

function cartSnapshot(){

function loadQueueItems(order){
 cart.clear();

  const product=products.find(p=>p.id===item.product_id)||{
   id:item.product_id,name:item.name,price:Number(item.price),image_url:null
  };
  cart.set(item.product_id,{product,qty:Number(item.qty)||1});
 });

}
function openQueuedPayment(id){
 const order=queueOrders.find(x=>x.id===id);if(!order)return;
 editingQueueId=id;selectedTable=String(order.tableNo||"1");localStorage.setItem("cdpSelectedTable",selectedTable);
 loadQueueItems(order);closeQueue();
 $("cash").value="";$("paymentModal").classList.remove("hidden");updatePayment();
}
function addDraftToQueue(orderType="dinein"){
 if(!cart.size){notify("Please select at least one menu item.");return}
 const items=cartSnapshot();
 if(orderType==="takeout"){
  const takeoutCount=queueOrders.filter(x=>x.orderType==="takeout").length;
  const orderLabel="Take Out #"+String(takeoutCount+1).padStart(3,"0");
  queueOrders.push({id:"q_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),orderType:"takeout",orderLabel,tableNo:null,items,createdAt:new Date().toISOString()});
  notify(`${orderLabel} saved to queue.`);
 }else{
  const existing=queueOrders.find(x=>x.orderType!=="takeout"&&String(x.tableNo)===String(selectedTable));
  if(existing){
   const merged=new Map((existing.items||[]).map(i=>[i.product_id,{...i}]));
   items.forEach(i=>{const old=merged.get(i.product_id);if(old)old.qty=Number(old.qty)+Number(i.qty);else merged.set(i.product_id,{...i})});
   existing.items=[...merged.values()];existing.updatedAt=new Date().toISOString();
   notify(`Items saved to Table ${selectedTable}'s existing order.`);
  }else{
   queueOrders.push({id:"q_"+Date.now()+"_"+Math.random().toString(36).slice(2,7),orderType:"dinein",tableNo:String(selectedTable),items,createdAt:new Date().toISOString()});
   notify(`Table ${selectedTable} order saved to queue.`);
  }
 }
 persistQueue();cart.clear();editingQueueId=null;stage="main";activeCategory="home";$("search").value="";
 renderCart();renderCategories();renderProducts();updateStageButtons();setCashierActionLabels();
}
function resetCashierDraft(){

 cart.clear();editingQueueId=null;stage="main";activeCategory="home";$("search").value="";
 renderCart();renderCategories();renderProducts();updateStageButtons();setCashierActionLabels();
}

function renderTableCards(){
 const grid=$("tableCardGrid");grid.innerHTML="";
 for(let n=1;n<=11;n++){
  const tableNo=String(n);
  const occupied=queueOrders.find(o=>o.orderType!=="takeout"&&String(o.tableNo)===tableNo);
  const card=document.createElement("button");
  card.type="button";
  card.className="table-choice"+(occupied?" occupied":" available");
  const number=document.createElement("strong");number.textContent="Table "+n;
  const status=document.createElement("span");status.textContent=occupied?"Has unpaid order":"Available";
  const detail=document.createElement("small");
  detail.textContent=occupied
   ? `${occupied.items.reduce((s,i)=>s+Number(i.qty||0),0)} items · ${money(occupied.items.reduce((s,i)=>s+Number(i.price)*Number(i.qty),0))}`
   : "Tap to select";
  card.append(number,status,detail);
  card.onclick=()=>{
   selectedTable=tableNo;
   localStorage.setItem("cdpSelectedTable",selectedTable);
   closeTablePicker();
   addDraftToQueue();
  };
  grid.append(card);
 }
}

$("confirmPayBtn").onclick=async()=>{
 const btn=$("confirmPayBtn");
 if(!cart.size){notify("No order items to pay.");return}
 const sum=Number(total().toFixed(2)),cash=Number(Number($("cash").value).toFixed(2));
 if(!Number.isFinite(cash)||cash<sum){notify("Cash received is less than the order total.");updatePayment();return}
 btn.disabled=true;btn.textContent="Saving...";
 const items=[...cart.values()].map(x=>({product_id:x.product.id,product_name:x.product.name,unit_price:Number(x.product.price),quantity:x.qty,line_total:Number(x.product.price)*x.qty}));
 const clientOrderId=newClientOrderId(),paidOrder=queueOrders.find(x=>x.id===editingQueueId),createdAt=new Date().toISOString();
 const localRecord={clientOrderId,items:items.map(i=>({product_id:i.product_id,product_name:i.product_name,unit_price:i.unit_price,quantity:i.quantity,line_total:i.line_total})),total:sum,cash,createdAt,cashierUserId:authUserId};
 let saved=null,offlineSaved=false;
 if(navigator.onLine&&!isOfflineCashier){
  const {data,error}=await sb.rpc("create_cash_order_offline_sync",{p_client_order_id:clientOrderId,p_items:items,p_total:sum,p_cash_received:cash});
  if(!error){saved=Array.isArray(data)?data[0]:data}
  else if(!navigator.onLine||/fetch|network|timeout|connection|load failed/i.test(error.message||"")){
   try{await saveOfflineSale(localRecord);offlineSaved=true;isOfflineCashier=true}catch(storageError){notify("Cannot save this sale offline: "+storageError.message);btn.disabled=false;btn.textContent="Confirm";updatePayment();return}
  }else{console.error(error);notify("Could not save order: "+error.message);btn.disabled=false;btn.textContent="Confirm";updatePayment();return}
 }else{
  try{await saveOfflineSale(localRecord);offlineSaved=true}catch(storageError){notify("Cannot save this sale offline: "+storageError.message);btn.disabled=false;btn.textContent="Confirm";updatePayment();return}
 }
 if(!offlineSaved&&!saved?.order_id){notify("The sale was not confirmed. Please retry before closing this order.");btn.disabled=false;btn.textContent="Confirm";updatePayment();return}
 const receiptNo=offlineSaved?"OFFLINE-"+clientOrderId.slice(0,8).toUpperCase():saved.receipt_no;
 lastReceipt={receipt:receiptNo,tableNo:paidOrder?.tableNo||null,orderLabel:paidOrder?.orderLabel||null,orderType:paidOrder?.orderType||"dinein",items,total:sum,cash,change:offlineSaved?Number((cash-sum).toFixed(2)):Number(saved.change_due),date:new Date(createdAt),offline:offlineSaved};
 if(editingQueueId)queueOrders=queueOrders.filter(x=>x.id!==editingQueueId);
 editingQueueId=null;persistQueue();renderReceipt(lastReceipt);
 $("paymentModal").classList.add("hidden");$("receipt").classList.remove("hidden");
 cart.clear();renderCart();btn.disabled=false;btn.textContent="Confirm";
 if(offlineSaved)notify("Sale saved on this device. It will sync automatically when internet returns.");
 await updateOfflineStatus();
};
